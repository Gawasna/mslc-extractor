name: Build x64

on:
  push:
    branches: [master, dev]
    tags: ['v*']
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

# Cancel in-progress runs on the same ref to avoid wasted runners
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # CI: compile-check on every push / PR
  # ---------------------------------------------------------------
  ci-build:
    name: CI — Build & Verify
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore Native.sln

      - name: Build Release x64
        run: msbuild Native.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Build Debug x64
        # Catches issues in Debug config (e.g. missing include paths, PCH errors)
        run: msbuild Native.sln /m /p:Configuration=Debug /p:Platform=x64

      - name: Verify build outputs (Release)
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'x64\Release'
          $minSizeKB = 10
          $required = @('Host.exe', 'Agent.dll')
          foreach ($file in $required) {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) {
              Write-Error "Required output not found: $path"
              exit 1
            }
            $sizeKB = [math]::Round((Get-Item $path).Length / 1KB, 1)
            if ($sizeKB -lt $minSizeKB) {
              Write-Error "$file is suspiciously small: ${sizeKB} KB (expected >= ${minSizeKB} KB)"
              exit 1
            }
            Write-Host "OK: $file (${sizeKB} KB)"
          }

  # ---------------------------------------------------------------
  # CD: package + attest + release — only on version tags
  # ---------------------------------------------------------------
  cd-release:
    name: CD — Release
    runs-on: windows-2022
    needs: ci-build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master branch
        shell: pwsh
        run: |
          $isOnMaster = git branch -r --contains ${{ github.sha }} | Select-String "origin/master"
          if (-not $isOnMaster) {
            Write-Error "Tag commit is not on master. Releases are only allowed from master."
            exit 1
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore Native.sln

      - name: Build Release x64
        run: msbuild Native.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Verify build outputs
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'x64\Release'
          $minSizeKB = 10
          $required = @('Host.exe', 'Agent.dll')
          foreach ($file in $required) {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) {
              Write-Error "Required output not found: $path"
              exit 1
            }
            $sizeKB = [math]::Round((Get-Item $path).Length / 1KB, 1)
            if ($sizeKB -lt $minSizeKB) {
              Write-Error "$file is suspiciously small: ${sizeKB} KB"
              exit 1
            }
            Write-Host "OK: $file (${sizeKB} KB)"
          }

      - name: Create SHA256SUMS.txt
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'x64\Release'
          $sumfile = Join-Path $out 'SHA256SUMS.txt'
          Get-ChildItem -Path $out -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            Sort-Object Name |
            ForEach-Object {
              $h = Get-FileHash $_.FullName -Algorithm SHA256
              "{0}  {1}" -f $h.Hash.ToLower(), $_.Name
            } | Out-File -FilePath $sumfile -Encoding ASCII
          Write-Host "Checksums:"
          Get-Content $sumfile

      - name: Package release artifacts
        shell: pwsh
        run: |
          $out  = Join-Path $env:GITHUB_WORKSPACE 'x64\Release'
          $tag  = "${{ github.ref_name }}"
          $name = "mslc-extractor-$tag-win-x64.zip"
          $dest = Join-Path $env:GITHUB_WORKSPACE $name
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Compress-Archive -Path "$out\Host.exe", "$out\Agent.dll", "$out\SHA256SUMS.txt" `
                           -DestinationPath $dest -Force
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$name"
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_PATH=$name"
          Write-Host "Created: $name"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            x64/Release/Host.exe
            x64/Release/Agent.dll
            x64/Release/SHA256SUMS.txt
            ${{ env.ZIP_PATH }}

      - name: Upload artifact (Actions UI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          allowUpdates: true
          body: |
            ### Binaries
            - **Platform**: Windows x64
            - **Version**: ${{ github.ref_name }}
            - **Build**: [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **Security:**
            - Verify checksums via `SHA256SUMS.txt` inside the zip.
            - Build provenance attested via GitHub Artifact Attestations.

            > **Note**: Anti-virus software may flag these files due to memory hooking techniques used to extract text.
          artifacts: ${{ env.ZIP_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false