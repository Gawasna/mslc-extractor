name: Build x64 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        # nuget restore resolves the native MinHook package committed under packages/.
        # If the packages/ folder is present in the repo, nuget reads packages.config
        # and skips downloading; this step is kept for correctness and future packages.
        run: nuget restore Native.sln

      - name: Build solution (x64 Release)
        run: msbuild Native.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Verify build outputs exist
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'x64\Release'
          $required = @('Host.exe', 'Agent.dll')
          foreach ($file in $required) {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) {
              Write-Error "Required build output not found: $path"
              exit 1
            }
            Write-Host "OK: $file ($([math]::Round((Get-Item $path).Length / 1KB, 1)) KB)"
          }

      - name: Create SHA256SUMS.txt
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'x64\Release'
          $sumfile = Join-Path $out 'SHA256SUMS.txt'
          Get-ChildItem -Path $out -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            Sort-Object Name |
            ForEach-Object {
              $h = Get-FileHash $_.FullName -Algorithm SHA256
              "{0}  {1}" -f $h.Hash.ToLower(), $_.Name
            } | Out-File -FilePath $sumfile -Encoding ASCII
          Write-Host "Checksums written to $sumfile"
          Get-Content $sumfile

      - name: Package release artifacts (zip)
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'x64\Release'
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "manual" }
          $zipName = "mslc-extractor-$tag-win-x64.zip"
          # Use the workspace root (forward-slash safe) as staging location to
          # avoid putting the zip inside the folder being zipped.
          $zipPath = Join-Path $env:GITHUB_WORKSPACE $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$out\Host.exe", "$out\Agent.dll", "$out\SHA256SUMS.txt" -DestinationPath $zipPath -Force
          # Write env vars using relative paths and Add-Content for cross-shell safety and BOM prevention.
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$zipName"
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_PATH=$zipName"
          Write-Host "Created artifact: $zipName at $zipPath"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            x64/Release/Host.exe
            x64/Release/Agent.dll
            x64/Release/SHA256SUMS.txt
            ${{ env.ZIP_PATH }}

      - name: Upload build artifact (Actions UI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}

      - name: Create GitHub release (from tag) and attach zip
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          allowUpdates: true
          body: |
            ### Binaries Details
            - **Platform**: Windows x64
            - **Version**: ${{ github.ref_name }}
            - **Build Run**: [View Process](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            **Security Verification:**
            - Verify SHA256 checksums in the `SHA256SUMS.txt` inside the zip.
            - This build is verified with **GitHub Artifact Attestations** (check the link above).
            
            > **Note**: Anti-virus software may flag these files due to the memory hooking techniques used to extract text.
          artifacts: ${{ env.ZIP_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false